name: Main engine active-source checks

on:
  push:
    branches: [main, 'audit/**']
  pull_request:

permissions:
  contents: read

jobs:
  active-main-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-test.txt
      - run: python tools/check_public_snapshot.py
      - name: Run active firstlight_CR checks (not frozen history-v2)
        run: python tools/run_main_engine_checks.py
